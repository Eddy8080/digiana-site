services:
  site-digiana:
    build: .
    container_name: site_digiana
    restart: unless-stopped
    ports:
      - "${SITE_PORT:-8002}:80"
    volumes:
      - ./index.html:/usr/share/nginx/html/index.html:ro
      - ./politica-de-privacidade.html:/usr/share/nginx/html/politica-de-privacidade.html:ro
      - ./robots.txt:/usr/share/nginx/html/robots.txt:ro
      - ./sitemap.xml:/usr/share/nginx/html/sitemap.xml:ro
      - ./llms.txt:/usr/share/nginx/html/llms.txt:ro
      - ./DigiAna - Icone.png:/usr/share/nginx/html/DigiAna - Icone.png:ro
      - ./favicon.png:/usr/share/nginx/html/favicon.png:ro
      - ./favicon.ico:/usr/share/nginx/html/favicon.ico:ro
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - api
    networks:
      - default
      - digiana_digiana_network

  api:
    build:
      context: ./api
      dockerfile: Dockerfile
    container_name: digiana_api_contato
    restart: unless-stopped
    env_file:
      - .env
    networks:
      - default
      - digiana_digiana_network

networks:
  default:
  digiana_digiana_network:
    external: true
